# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
$schema: "http://json-schema.org/draft-07/schema#"
description: >
  A repeatable procedure that re-establishes one of this repo's claims, with a
  control, a treatment, and the reading of both.
type: object
additionalProperties: false
required: [why]
properties:
  why:
    description: Paths to the goal entries this procedure serves.
    type: array
    minItems: 1
    items:
      type: string
