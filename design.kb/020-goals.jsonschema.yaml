# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
$schema: "http://json-schema.org/draft-07/schema#"
description: >
  A property the cleanroom must have in order to serve the mission. Stated as
  what must be true, never as the mechanism that happens to achieve it today.
type: object
additionalProperties: false
required: [why]
properties:
  why:
    description: Paths to the mission entries this goal serves.
    type: array
    minItems: 1
    items:
      type: string
