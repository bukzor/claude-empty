# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
$schema: "http://json-schema.org/draft-07/schema#"
description: >
  A mechanism this repo chose in order to produce one of the goals' properties.
  Names the constraint it works around by citing background.kb rather than
  restating it.
type: object
additionalProperties: false
required: [why]
properties:
  why:
    description: Paths to the goal entries this mechanism serves.
    type: array
    minItems: 1
    items:
      type: string
